---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: deploy-rootpages-stable
  namespace: ns-rootpages
  labels:
    app: rootpages-stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rootpages-stable
  strategy:
    # Keep the existing Pods serving traffic until the new Pods have finished building the documentation and are ready.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rootpages-stable
    spec:
      initContainers:
        - name: sphinx
          image: sphinxdoc/sphinx:8.2.3
          command:
            - /bin/sh
            - -c
            - "pip install sphinx_rtd_theme && apt-get update && apt-get -y install git && rm -rf rootpages && git clone --depth 1 --branch stable https://github.com/ekultails/rootpages.git && make -C rootpages html && find /html -mindepth 1 -delete && cp -a rootpages/build/html/. /html/"
          env:
            - name: DEBIAN_FRONTEND
              value: noninteractive
          # The "emptyDir" volume persists across a node reboot so the init container must replace any existing build.
          volumeMounts:
            - name: tmp-dir
              mountPath: /html
          workingDir: /tmp
      containers:
        - name: nginx
          image: nginx:1.29.5
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 256Mi
          volumeMounts:
            - name: tmp-dir
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: tmp-dir
          emptyDir: {}
